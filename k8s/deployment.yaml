apiVersion: apps/v1
kind: Deployment
metadata:
  name: tls-sentinel
  labels:
    app.kubernetes.io/name: tls-sentinel
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: tls-sentinel
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tls-sentinel
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: tls-sentinel
          image: tls-sentinel:0.1.0
          imagePullPolicy: IfNotPresent
          args: ["serve", "--config", "/etc/tls-sentinel/config.yaml"]
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet: {path: /readyz, port: http}
          livenessProbe:
            httpGet: {path: /healthz, port: http}
          resources:
            requests: {cpu: 25m, memory: 48Mi}
            limits: {cpu: 250m, memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: config, mountPath: /etc/tls-sentinel, readOnly: true}
            - {name: history, mountPath: /data}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: config
          configMap: {name: tls-sentinel-config}
        - name: history
          persistentVolumeClaim: {claimName: tls-sentinel-history}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: tls-sentinel-history
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: tls-sentinel
  labels:
    app.kubernetes.io/name: tls-sentinel
spec:
  selector:
    app.kubernetes.io/name: tls-sentinel
  ports:
    - {name: http, port: 8080, targetPort: http}
