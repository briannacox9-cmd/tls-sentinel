[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tls-sentinel"
version = "0.1.0"
description = "Verify the certificate a live TLS endpoint is actually serving"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["PyYAML>=6.0.2,<7", "cryptography>=44,<47"]

[project.optional-dependencies]
dev = ["build>=1.2", "ruff>=0.12,<1"]

[project.scripts]
tls-sentinel = "tls_sentinel.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
