name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev]'
      - name: Compile and test
        run: ruff check src tests scripts && python -m compileall -q src tests scripts && python -m unittest discover -s tests -v
      - name: Build package
        run: python -m build
      - name: Build container
        run: docker build -t tls-sentinel:ci .
